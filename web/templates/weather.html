{% extends "base.html" %}
{% block title %}Weather – MODE-S Wind{% endblock %}

{% block content %}
<div class="windmap-page weather-page">

  <!-- ── Control strip ──────────────────────────────────────────────── -->
  <div class="windmap-controls">
    <!-- the view (from 2026-11-05): the map or a meteogram of one place -->
    <div class="wm-group wx-viewsw" role="group" aria-label="View">
      <button id="wx-v-map" class="wm-play-btn wx-vbtn wx-von" type="button" title="The weather map with the time slider">Map</button>
      <button id="wx-v-mg" class="wm-play-btn wx-vbtn" type="button" title="A meteogram: the model's temperature, precipitation, wind, pressure and clouds at one place over the days, from MEPS and (where the server has it) GFS">Meteogram</button>
    </div>
    <!-- the meteogram's own controls (shown with the Meteogram view) -->
    <div class="wm-group" id="wx-mg-ctrl">
      <label class="wm-label">Place</label>
      <select id="wx-mg-place" class="wm-select" title="The place of the meteogram: the airport, a receiver site (its position to 0.01°), or a place pinned on the map (Point values → a click → Meteogram in its card)">
        <option value="apt" selected>{{ airport_icao }}</option>
      </select>
      <label class="wm-label">Model</label>
      <select id="wx-mg-model" class="wm-select" title="MEPS — the past days and about 2 days ahead (2.5 km near the airport, else 10 km){% if gfs_on %}; GFS — from now up to 16 days ahead (0.25°); Both — GFS's days with MEPS drawn over its own (MEPS bold, GFS thin and dashed){% endif %}">
        <option value="meps"{% if not gfs_on %} selected{% endif %}>MEPS</option>
        {% if gfs_on %}<option value="gfs">GFS</option>
        <option value="both" selected>Both</option>{% endif %}
      </select>
      <label class="wm-label">Range</label>
      <select id="wx-mg-range" class="wm-select" title="How long a period the meteogram shows"></select>
      <label class="wm-check" title="2 m temperature (red above, blue below 0 °C) with the day's highest and lowest"><input type="checkbox" id="wx-mg-temp" checked> Temperature</label>
      <label class="wm-check" title="Precipitation in mm per hour (rain blue, snow violet; GFS's 3-hour steps as wider bars) with the day's total in mm"><input type="checkbox" id="wx-mg-precip" checked> Precipitation</label>
      <label class="wm-check" title="10 m wind speed and gusts (kt) with wind barbs along the top"><input type="checkbox" id="wx-mg-wind" checked> Wind</label>
      <label class="wm-check" title="Sea-level pressure (hPa)"><input type="checkbox" id="wx-mg-pres" checked> Pressure</label>
      <label class="wm-check" title="High, medium and low cloud (and fog with MEPS) as grey rows, darker with more cover; the cloud base (MEPS) or the ceiling (GFS) in ft"><input type="checkbox" id="wx-mg-cloud" checked> Clouds</label>
      {% if gfs_on %}<label class="wm-check" title="A light band around the temperature and wind-speed lines: how far off the forecast has been at this lead time — 8 in 10 of the checked hours of the last 30 days were within it (GFS, and MEPS over its own days; measured against the {{ airport_icao }} METAR); the table under the chart gives the numbers"><input type="checkbox" id="wx-mg-err" checked> Typical error</label>{% endif %}
    </div>
    {% if gfs_on %}
    <!-- the model (from 2026-11-05): MEPS (2.5 km, about 2 days ahead) or GFS (global, 0.25°, 16 days; viewing only) -->
    <div class="wm-group">
      <label class="wm-label">Model</label>
      <select id="wx-model" class="wm-select" title="MEPS — MET Norway's 2.5 km model of the Nordic area: the past days and about 2 days ahead. GFS — NOAA's global model (0.25°, about 28 × 14 km here): from now up to 16 days ahead, the 00 and 12 UTC runs; beyond a week a rough guide only. For viewing — not used in any of MODE-S Wind's analysis">
        <option value="meps" selected>MEPS</option>
        <option value="gfs">GFS</option>
      </select>
    </div>
    {% endif %}
    <label class="wm-check" title="Sea-level pressure: isobars every 4 hPa (1000 hPa drawn thicker) with the highs (H) and lows (L) and their central pressure">
      <input type="checkbox" id="wx-pres" checked> Pressure
    </label>
    <label class="wm-check" title="Rain and snow of the hour ending at the shown time (mm of water per hour): rain light blue → blue → green → yellow → red → pink, snow in violet shades">
      <input type="checkbox" id="wx-rain" checked> Rain / snow
    </label>
    <div class="wm-group">
      <label class="wm-label">Wind</label>
      <select id="wx-wind" class="wm-select" title="The model's 10 m wind: Barbs — wind barbs (kt) about 50 px apart; Colours — the wind speed in colour bands of 5 kt (calm blue-violet, blue, teal, green, yellow, orange, red, magenta from 50 kt); Barbs + colours — both. The hover read-out gives direction and speed">
        <option value="off" selected>Off</option>
        <option value="barbs">Barbs</option>
        <option value="colours">Colours</option>
        <option value="both">Barbs + colours</option>
      </select>
    </div>
    <label class="wm-check" title="The model's 10 m wind gust, shaded from 25 kt (Beaufort 6) through gale 34, strong gale 41, storm 48 and violent storm 56 to hurricane force 64 kt; on the 20 km grid the strongest gust of each cell">
      <input type="checkbox" id="wx-gust"> Gusts
    </label>
    <div class="wm-group">
      <label class="wm-label">Temperature</label>
      <select id="wx-temp" class="wm-select" title="The model's 2 m temperature: Colours — bands of 2 °C (purple, blue below freezing, cyan at 0 °C, green, yellow, orange, red) with the 0 °C line; Isotherms — lines every 2 °C (every 4 °C zoomed out), 0 °C thick; Numbers — only the temperature in whole degrees (°C), in one colour on the grid chosen below (about every 110, 70 or 45 px; in the 2.5 km box its own values), inland and at sea. The hover read-out gives the value">
        <option value="off" selected>Off</option>
        <option value="fill">Colours</option>
        <option value="lines">Isotherms</option>
        <option value="numbers">Numbers</option>
      </select>
    </div>
    <label class="wm-check" title="With Colours: the temperature in whole degrees (°C) as small numbers on the grid chosen beside">
      <input type="checkbox" id="wx-tnum"> Numbers
    </label>
    <div class="wm-group" id="wx-tgrid-wrap">
      <select id="wx-tgrid" class="wm-select" title="How close together the temperature numbers are: Normal — about every 110 px; Dense — about every 70 px; Very dense — about every 45 px. Inside the 2.5 km box (zoomed in) the numbers are its own values on its own grid, so they can come as close as its cells">
        <option value="normal">Grid: normal</option>
        <option value="dense" selected>Grid: dense</option>
        <option value="vdense">Grid: very dense</option>
      </select>
    </div>
    <div class="wm-group">
      <label class="wm-label">Clouds</label>
      <select id="wx-cloud" class="wm-select" title="Cloud layer drawn as grey shading, denser with more cover (fog in yellow); the hover read-out adds the cloud base">
        <option value="off" selected>Off</option>
        <option value="c">Total</option>
        <option value="l">Low</option>
        <option value="m">Medium</option>
        <option value="h">High</option>
        <option value="f" id="wx-cloud-fog">Fog</option>
      </select>
    </div>
    <label class="wm-check" title="Point values: click anywhere on the map for the model's values at that place (those of the layers shown) — they follow the time slider and the animation; click elsewhere for another place, × or Esc closes. Off: a click on the map does nothing (the hover read-out at the bottom left works either way)">
      <input type="checkbox" id="wx-point"> Point values
    </label>
    <!-- the receivers' triangles (from 2026-11-02, as the Live Map's Receiver → Markers) -->
    <label class="wm-check" title="The receivers' positions on the map: a small triangle each (MODES-RX-01 light blue, MODES-RX-02 violet; to about 1 km) — untick to see the map without them. Remembered in the browser">
      <input type="checkbox" id="wx-rxmk" checked> Receivers
    </label>

    <div class="wm-group" id="wx-past-wrap">
      <label class="wm-label">Past</label>
      <select id="wx-past" class="wm-select" title="How far back the time slider reaches">
        <option value="24" selected>24 h</option>
        <option value="72">3 days</option>
        <option value="168">7 days</option>
      </select>
    </div>
    <div class="wm-group">
      <label class="wm-label">Forecast</label>
      <select id="wx-fc" class="wm-select" title="How far ahead the time slider reaches (the newest model run)">
        <option value="0">none</option>
        <option value="24">24 h</option>
        <option value="48" selected>48 h</option>
      </select>
      <select id="wx-gfc" class="wm-select" hidden title="How far ahead the time slider reaches with GFS (the newest of its 00 / 12 UTC runs): hourly to +120 h, then every 3 h">
        <option value="48">48 h</option>
        <option value="120">5 days</option>
        <option value="240">10 days</option>
        <option value="384" selected>16 days</option>
      </select>
    </div>
    <div class="wm-group">
      <label class="wm-label">Grid</label>
      <select id="wx-step" class="wm-select" title="Resolution sent to the browser: 20 km loads about 30 kB per hour (about 55 kB with the 10 m wind and gusts), 10 km (the stored resolution) about 3 times more">
        <option value="2" selected>20 km</option>
        <option value="1">10 km</option>
      </select>
      <select id="wx-gstep" class="wm-select" hidden title="GFS resolution sent to the browser: 0.5° (about 55 × 28 km here) loads about 35 kB per hour, 0.25° (the model's own grid, about 28 × 14 km) about 4 times more — 16 days are 209 hours">
        <option value="2" selected>0.5°</option>
        <option value="1">0.25°</option>
      </select>
    </div>
    <div class="wm-group" id="wx-fine-wrap">
      <label class="wm-label">Detail</label>
      <select id="wx-fine" class="wm-select" title="The model's full 2.5 km grid in a 300 × 300 km box around the airport, used when the map is zoomed in (zoom 7 and closer) — showers, fog patches and the coastline's effect on wind and cloud; a faint dotted line marks the box. About 30 kB per hour with rain and isobars">
        <option value="auto" selected>2.5 km near EFHK</option>
        <option value="off">Off</option>
      </select>
    </div>
    <div class="wm-group">
      <label class="wm-label">Opacity</label>
      <select id="wx-op" class="wm-select" title="How strongly the filled layers are drawn — rain and snow, gusts, clouds, fog and the temperature colours (75 % as before; isobars, barbs, lines and numbers stay as they are)">
        <option value="25">25 %</option>
        <option value="50">50 %</option>
        <option value="75" selected>75 %</option>
        <option value="100">100 %</option>
      </select>
    </div>
    <div class="wm-group">
      <label class="wm-label">Shading</label>
      <select id="wx-smooth" class="wm-select" title="Smooth: the model's values are interpolated between the grid points — rain, snow, gusts and the radar as smooth contour bands, clouds and fog as smooth shading; the values and colour steps are the same. Cells: each grid cell in one colour, as the model stores it">
        <option value="on" selected>Smooth</option>
        <option value="off">Cells</option>
      </select>
    </div>

    <div class="wm-group wm-time">
      <button id="wx-play" class="wm-play-btn" type="button" title="Animate the period (one hour about every 0.4 s); click again to stop">▶</button>
      <button id="wx-dprev" class="wm-play-btn wx-step-btn" type="button" hidden title="One day back">−1d</button>
      <button id="wx-prev" class="wm-play-btn wx-step-btn" type="button" title="One hour back (also the ← key on the slider)">−1h</button>
      <span class="wm-tslide"><input type="range" id="wx-t" min="0" max="0" step="1" value="0"><span id="wx-tload" class="wm-tload wm-hidden"></span></span>
      <button id="wx-next" class="wm-play-btn wx-step-btn" type="button" title="One hour forward (also the → key on the slider)">+1h</button>
      <button id="wx-dnext" class="wm-play-btn wx-step-btn" type="button" hidden title="One day forward">+1d</button>
      <button id="wx-now" class="wm-play-btn" type="button" title="Back to the present hour">⟲</button>
      <span id="wx-tlabel" class="wm-tlabel">—</span>
    </div>
  </div>

  <!-- ── Map ─────────────────────────────────────────────────────────── -->
  <div class="windmap-mapwrap">
    <div id="wx-map" class="windmap-map"></div>
    <div id="wx-point-card" class="wx-point-card" hidden></div>
    <div class="wm-overlay">
      <div class="wm-legend" id="wx-legend"></div>
      <div id="wx-readout" class="wm-status wm-hidden"></div>
      <div id="wx-status" class="wm-status">Loading…</div>
    </div>
  </div>
  <!-- ── Meteogram (from 2026-11-05; static/js/meteogram.js, weather_mg.js) ── -->
  <div id="wx-mg" class="wx-mg">
    <div id="wx-mg-head" class="wx-mg-head"></div>
    <div id="wx-mg-chart" class="wx-mg-chart"></div>
    <div id="wx-mg-foot" class="wm-status wx-mg-foot"></div>
    <div id="wx-mg-skill" class="wx-mg-skill" hidden></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const RECEIVER_LAT = {{ receiver_lat }};
const RECEIVER_LON = {{ receiver_lon }};
</script>
<script src="{{ url_for('static', filename='js/wx_layer.js') }}"></script>
<script>
const MG_AIRPORT = { icao: {{ airport_icao|tojson }}, lat: {{ airport_lat }}, lon: {{ airport_lon }} };
const MG_GFS = {{ 'true' if gfs_on else 'false' }};
</script>
<script src="{{ url_for('static', filename='js/meteogram.js') }}"></script>
<script src="{{ url_for('static', filename='js/weather.js') }}"></script>
<script src="{{ url_for('static', filename='js/weather_mg.js') }}"></script>
<style>
.weather-page .wm-tslide { position:relative; display:inline-flex; align-items:center; }
.weather-page .wm-time input[type=range] { width: 260px; }
.weather-page .wm-tload { position:absolute; left:6px; right:6px; bottom:-4px; height:3px; display:flex; gap:1px; pointer-events:none; }
.weather-page .wm-tload i { flex:1; background:var(--border); border-radius:1px; }
.weather-page .wm-tload i.ok { background:var(--accent); opacity:.75; }
.weather-page .wm-tload i.fc.ok { background:#a855f7; }
.weather-page .wm-tlabel { min-width: 330px; }
.weather-page .wx-step-btn { width:auto; min-width:34px; padding:0 6px; font-size:.78rem; text-align:center; white-space:nowrap; }   /* text inside the button (26 Oct 2026) */
.weather-page .wx-step-btn:disabled { opacity:.35; cursor:default; }
.wx-canvas { position:absolute; left:0; top:0; pointer-events:none; }
/* the view switch and the meteogram (from 2026-11-05) */
.weather-page .wx-viewsw { gap:0; }
.weather-page .wx-vbtn { width:auto; padding:0 10px; font-size:.8rem; border-radius:0; }
.weather-page .wx-vbtn:first-child { border-radius:4px 0 0 4px; }
.weather-page .wx-vbtn:last-child { border-radius:0 4px 4px 0; margin-left:-1px; }
.weather-page .wx-vbtn.wx-von { background:var(--accent); color:#fff; border-color:var(--accent); }
.weather-page #wx-mg-ctrl { display:none; flex-wrap:wrap; gap:6px 10px; align-items:center; }
.weather-page.wx-mg-mode #wx-mg-ctrl { display:flex; }
.weather-page.wx-mg-mode .windmap-controls > :not(.wx-viewsw):not(#wx-mg-ctrl) { display:none !important; }
.weather-page.wx-mg-mode .windmap-mapwrap { display:none; }
.weather-page.wx-mg-mode .wx-point-card { display:none; }
.wx-mg { display:none; flex:1; min-height:0; padding:8px 12px 14px; overflow:auto; }
.weather-page.wx-mg-mode .wx-mg { display:block; }
.wx-mg-head { font-size:.85rem; color:var(--text-2); margin-bottom:4px; }
.wx-mg-head b { color:var(--text-1); }
.wx-mg-chart { max-width:1700px; }
.wx-mg-chart .mg-read { font-size:.78rem; min-height:2.6em; color:var(--text-1); margin:2px 0 4px; line-height:1.3; }
.wx-mg-chart .mg-read .mg-dim, .wx-mg .mg-empty { color:var(--text-3); }
.wx-mg-foot { margin-top:4px; white-space:normal; }
/* how good the forecast has been at the airport (from 2026-11-06, /api/weather/gfs_skill) */
.wx-mg-skill { margin-top:12px; max-width:980px; font-size:.8rem; color:var(--text-2); }
.wx-mg-skill[hidden] { display:none; }
.wx-mg-skill h4 { margin:0 0 4px; font-size:.86rem; color:var(--text-1); font-weight:600; }
.wx-mg-skill .sk-sum { margin:0 0 6px; color:var(--text-1); }
.wx-mg-skill table { border-collapse:collapse; font-variant-numeric:tabular-nums; }
.wx-mg-skill th, .wx-mg-skill td { padding:2px 8px; text-align:right; border-bottom:1px solid var(--border); white-space:nowrap; }
.wx-mg-skill th:first-child, .wx-mg-skill td:first-child { text-align:left; color:var(--text-2); }
.wx-mg-skill thead th { color:var(--text-1); font-weight:600; }
.wx-mg-skill tr.sk-meps td { color:var(--text-3); }
.wx-mg-skill td.sk-good { color:#16a34a; }
.wx-mg-skill td.sk-fair { color:#ca8a04; }
.wx-mg-skill td.sk-poor { color:var(--text-3); }
.wx-mg-skill .sk-note { margin-top:4px; color:var(--text-3); line-height:1.4; }
.wx-point-card .wx-pc-mg { display:inline-block; margin-top:4px; padding:1px 8px; border:1px solid var(--border); border-radius:4px; background:var(--bg-3); color:var(--text-1); font:inherit; font-size:11px; cursor:pointer; }
/* Point values (from 2026-11-01, as the phone's tap): the card next to the pin (placed by weather.js) */
.weather-page.wx-point-mode .leaflet-container { cursor: crosshair; }
.weather-page.wx-point-mode .leaflet-container.leaflet-drag-target { cursor: grabbing; }
.wx-point-card { position:absolute; left:0; top:0; z-index:800; min-width:220px; max-width:min(420px, calc(100% - 20px));
                 padding:6px 26px 6px 10px; border:1px solid var(--border); border-radius:6px; background:rgba(22, 32, 48, 0.92);
                 font-size:12px; line-height:1.45; color:var(--text-1); box-shadow:0 2px 8px rgba(0,0,0,.35); }
[data-theme="light"] .wx-point-card { background:rgba(248, 250, 252, 0.96); box-shadow:0 2px 8px rgba(0,0,0,.18); }
.wx-point-card[hidden] { display:none; }
.wx-point-card .wx-pc-head { font-weight:600; }
.wx-point-card .wx-pc-time { color:var(--text-2); margin-bottom:2px; }
.wx-point-card .wx-pc-row { white-space:nowrap; }
.wx-point-card small { display:block; margin-top:3px; color:var(--text-3); font-size:10.5px; }
.wx-point-card .wx-pc-x { position:absolute; right:4px; top:3px; width:20px; height:20px; padding:0; border:0; border-radius:4px;
                          background:none; color:var(--text-2); font-size:15px; line-height:20px; cursor:pointer; }
.wx-point-card .wx-pc-x:hover { background:var(--bg-3); color:var(--text-1); }
.wx-point-pin { width:14px; height:14px; border:2px solid #fff; border-radius:50%; box-shadow:0 0 0 1px #000; margin:-9px 0 0 -9px; }
.wx-fc { color:#c084fc; font-weight:bold; }
[data-theme="light"] .wx-fc { color:#7c3aed; }
</style>
{% endblock %}
