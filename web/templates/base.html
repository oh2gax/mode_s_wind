<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MODE-S Wind{% endblock %}</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <!-- Apply saved theme before first paint to prevent flash of wrong theme -->
  <script>
    (function(){
      if (localStorage.getItem('ms_theme') === 'light')
        document.documentElement.dataset.theme = 'light';
    })();
  </script>
</head>
<body>

<nav class="navbar">
  <div class="nav-brand">
    <span>MODE-S Wind</span>
  </div>
  <div class="nav-links">
    <a href="/"             target="mw_live"         class="nav-link {% if request.endpoint == 'index'             %}active{% endif %}">Live Map</a>
    <a href="/flights"      target="mw_flights"      class="nav-link {% if request.endpoint == 'flights_page'      %}active{% endif %}">Flights</a>
    <a href="/sounding"     target="mw_sounding"     class="nav-link {% if request.endpoint == 'sounding_page'     %}active{% endif %}">Sounding</a>
    <a href="/windmap"      target="mw_windmap"      class="nav-link {% if request.endpoint == 'windmap_page'      %}active{% endif %}">Wind Map</a>
    <a href="/weather"      target="mw_weather"      class="nav-link {% if request.endpoint == 'weather_page'      %}active{% endif %}">Weather</a>
    <a href="/windshear"    target="mw_windshear"    class="nav-link {% if request.endpoint == 'windshear_page'    %}active{% endif %}">Windshear</a>
    <a href="/gps"          target="mw_gps"          class="nav-link {% if request.endpoint == 'gps_page'          %}active{% endif %}">GPS Quality</a>
    <a href="/gps-episodes" target="mw_gps_episodes" class="nav-link {% if request.endpoint == 'gps_episodes_page' %}active{% endif %}">GPS Episodes</a>
  </div>
  <div class="nav-config-badges">
    <span class="config-badge badge-src-{{ meteo_source_mode | lower }}"
          title="Meteo source mode: {{ meteo_source_mode }}">{{ meteo_source_mode }}</span>
    <span class="config-badge badge-storage-{{ storage_mode | lower }}"
          title="Storage mode: {{ storage_mode }}">{{ storage_mode }}</span>
  </div>
  <button id="nav-theme-btn" class="nav-theme-btn" title="Toggle display theme">Dark</button>
  <button id="nav-whatsnew-btn" class="nav-whatsnew-btn" type="button" data-version="{{ app_version }}"
          title="Version {{ app_version }} — What's new (changes of the last versions) and the user guides">{{ app_version }}<span class="wn-lbl"> · What's new · Guides</span><span id="nav-whatsnew-dot" class="nav-whatsnew-dot" hidden></span></button>
  <span id="nav-utc-clock" class="nav-utc-clock"></span>
  <div class="nav-status">
    <span id="status-dot" class="status-dot status-connecting"></span>
    <span id="status-text">Connecting…</span>
    &nbsp;|&nbsp;
    <span id="nav-live-count">–</span> live &nbsp;
    <span id="nav-meteo-count" class="badge-meteo">–</span> meteo
  </div>
</nav>

<main>
  {% block content %}{% endblock %}
</main>

<!-- What's new / User guides window (doc/whats_new.md and doc/guides.md via /api/whatsnew) -->
<div id="wn-overlay" class="wn-overlay" hidden>
  <div class="wn-box" role="dialog" aria-modal="true" aria-label="What's new and user guides">
    <div class="wn-head">
      <div class="wn-tabs" role="tablist">
        <button class="wn-tab active" type="button" role="tab" data-tab="news">What's new</button>
        <button class="wn-tab" type="button" role="tab" data-tab="guides">User guides</button>
      </div>
      <button id="wn-close" class="wn-close" type="button" title="Close (Esc)">×</button>
    </div>
    <div id="wn-body-news" class="wn-body">Loading…</div>
    <div id="wn-body-guides" class="wn-body" hidden>Loading…</div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<!-- CARTO Basemaps API key — injected server-side from api_keys.py (gitignored); -->
<!-- appended to CARTO tile URLs by live_map.js / windmap.js / windshear.js to remove the watermark -->
<script>
const CARTO_API_KEY = {{ carto_api_key | tojson }};
</script>
{% block scripts %}{% endblock %}
<script>
// ── Theme toggle ────────────────────────────────────────────────────────────
(function () {
  var btn = document.getElementById('nav-theme-btn');

  function applyTheme(theme) {
    if (theme === 'light') {
      document.documentElement.dataset.theme = 'light';
      btn.textContent = 'Dark';
    } else {
      delete document.documentElement.dataset.theme;
      btn.textContent = 'Light';
    }
    // Let each page redraw its canvases with the new palette
    if (typeof window.onThemeChange === 'function') window.onThemeChange();
  }

  // Sync button label with whatever the head script already applied
  if (document.documentElement.dataset.theme === 'light') btn.textContent = 'Dark';

  btn.addEventListener('click', function () {
    var next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    localStorage.setItem('ms_theme', next);
    applyTheme(next);
  });
})();

// ── Navigation: one browser tab per page ────────────────────────────────────
// Each nav link has its own named target (mw_<page>).  This tab takes the
// name of the page it shows, so clicking a page that is already open in
// another tab switches to that tab without reloading it (selections are
// kept); a page that is not open yet opens in a new tab.  Clicking the link
// of the page shown in this tab reloads it here, as before.  Ctrl / Shift /
// middle click keep the browser's normal behaviour.
(function () {
  var active = document.querySelector('.nav-links .nav-link.active');
  if (active) window.name = active.getAttribute('target');
  document.querySelectorAll('.nav-links .nav-link').forEach(function (a) {
    a.addEventListener('click', function (e) {
      if (e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
      var name = a.getAttribute('target');
      if (!name || name === window.name) { e.preventDefault(); location.href = a.href; return; }
      var w = null;
      try { w = window.open('', name); } catch (err) { w = null; }
      if (!w) return;                       // popup blocked → default (target) behaviour
      e.preventDefault();
      var fresh = true;
      try { fresh = !w.location.href || w.location.href === 'about:blank'; } catch (err) { fresh = false; }
      if (fresh) w.location.href = a.href; // new tab → load the page
      w.focus();                            // existing tab → just bring it to front
    });
  });
})();

// Global stats refresh (navbar)
async function refreshStats() {
  const dot  = document.getElementById('status-dot');
  const text = document.getElementById('status-text');
  try {
    const r = await fetch('/api/stats');
    const d = await r.json();
    document.getElementById('nav-live-count').textContent  = d.live_aircraft   ?? '–';
    document.getElementById('nav-meteo-count').textContent = d.live_with_meteo ?? '–';
    // Only update if SSE hasn't already set it to 'Live'
    if (!dot.classList.contains('status-live')) {
      dot.className   = 'status-dot status-live';
      text.textContent = 'Online';
    }
  } catch(e) {
    if (!dot.classList.contains('status-live')) {
      dot.className   = 'status-dot status-error';
      text.textContent = 'Error';
    }
  }
}
refreshStats();
setInterval(refreshStats, 15000);

// ── What's new window ───────────────────────────────────────────────────────
// The link shows the version (v.DDMMYYYY); a dot marks a version this browser
// has not opened yet.  The window has two tabs: What's new (notes of the last
// versions, doc/whats_new.md) and User guides (the PDF guides, doc/guides.md);
// it scrolls; × / Esc / outside closes.
(function () {
  var btn = document.getElementById('nav-whatsnew-btn');
  if (!btn) return;
  var ver = btn.dataset.version || '';
  var dot = document.getElementById('nav-whatsnew-dot');
  var ov = document.getElementById('wn-overlay');
  var bodies = { news: document.getElementById('wn-body-news'), guides: document.getElementById('wn-body-guides') };
  var tabs = document.querySelectorAll('.wn-tab');
  var seen = null;
  try { seen = localStorage.getItem('ms_seen_version'); } catch (e) { seen = null; }
  if (ver && seen !== ver) dot.hidden = false;
  if (!ver) { btn.firstChild.textContent = ''; btn.classList.add('no-ver'); }

  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function inline(t) {
    return esc(t).replace(/`([^`]+)`/g, '<code>$1</code>')
                 .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
                 .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>');
  }
  // the small Markdown subset of the notes: bullets (two levels) and paragraphs
  function render(lines) {
    var html = '', depth = 0, para = [];
    function flush() { if (para.length) { html += '<p>' + inline(para.join(' ')) + '</p>'; para = []; } }
    function close(to) { while (depth > to) { html += '</ul>'; depth--; } }
    lines.forEach(function (l) {
      var m = l.match(/^(\s*)[-*]\s+(.*)$/);
      if (m) {
        flush();
        var d = m[1].length >= 2 ? 2 : 1;
        while (depth < d) { html += '<ul>'; depth++; }
        close(d);
        html += '<li>' + inline(m[2]) + '</li>';
      } else if (!l.trim()) { flush(); close(0); }
      else { close(0); para.push(l.trim()); }
    });
    flush(); close(0);
    return html;
  }
  function fmtVer(v) { var d = v.slice(2); return d.slice(0, 2) + '.' + d.slice(2, 4) + '.' + d.slice(4); }
  function fmtIso(d) { var p = (d || '').split('-'); return p.length === 3 ? p[2] + '.' + p[1] + '.' + p[0] : (d || ''); }
  function news(es) {
    return es.length ? es.map(function (e) {
      return '<section class="wn-entry"><h3><span class="wn-ver">' + esc(e.version) + '</span>' +
             '<span class="wn-date">' + fmtVer(e.version) + '</span>' +
             (e.version === ver ? '<span class="wn-current">current</span>' : '') + '</h3>' +
             (e.title ? '<div class="wn-etitle">' + inline(e.title) + '</div>' : '') +
             render(e.lines) + '</section>';
    }).join('') + '<p class="wn-foot">Earlier changes: CHANGELOG.md in the project.</p>'
      : '<p>No notes found.</p>';
  }
  function guides(gs) {
    if (!gs.length) return '<p>No user guides on this system.</p>';
    return '<p class="wn-intro">The guides open as PDF in a new browser tab (large files: '
         + 'the first opening can take a while on a slow connection).</p>' + gs.map(function (g) {
      var meta = [g.version ? 'Version ' + esc(g.version) : '', g.date ? fmtIso(g.date) : '',
                  g.pages ? esc(g.pages) + ' pages' : '', (g.size / 1e6).toFixed(1) + ' MB']
                 .filter(Boolean).join(' · ');
      return '<section class="wn-entry wn-guide"><h3>' + esc(g.title) + '</h3>' +
             '<div class="wn-gmeta">' + meta + '</div>' + render(g.lines) +
             '<div class="wn-gbtns"><a class="wn-gbtn wn-gopen" href="' + esc(g.url) + '" target="_blank" rel="noopener">Open PDF</a>' +
             '<a class="wn-gbtn" href="' + esc(g.url) + '" download>Download</a></div></section>';
    }).join('');
  }
  function show(tab) {
    tabs.forEach(function (t) { t.classList.toggle('active', t.dataset.tab === tab); t.setAttribute('aria-selected', t.dataset.tab === tab); });
    Object.keys(bodies).forEach(function (k) { bodies[k].hidden = k !== tab; });
  }
  var loaded = false;
  async function open(tab) {
    ov.hidden = false;
    show(tab || 'news');
    document.addEventListener('keydown', onKey);
    try { localStorage.setItem('ms_seen_version', ver); } catch (e) { /* private mode */ }
    dot.hidden = true;
    if (loaded) return;
    try {
      var d = await (await fetch('/api/whatsnew')).json();
      bodies.news.innerHTML = news(d.entries || []);
      bodies.guides.innerHTML = guides(d.guides || []);
      loaded = true;
    } catch (err) {
      bodies.news.textContent = bodies.guides.textContent = 'Could not load the notes.';
    }
  }
  function close() { ov.hidden = true; document.removeEventListener('keydown', onKey); }
  function onKey(e) { if (e.key === 'Escape') close(); }
  btn.addEventListener('click', function () { open('news'); });
  tabs.forEach(function (t) { t.addEventListener('click', function () { show(t.dataset.tab); }); });
  document.getElementById('wn-close').addEventListener('click', close);
  ov.addEventListener('click', function (e) { if (e.target === ov) close(); });
})();

// ── UTC clock ────────────────────────────────────────────────────────────────
(function () {
  const el = document.getElementById('nav-utc-clock');
  function tick() {
    const n = new Date();
    const pad = v => String(v).padStart(2, '0');
    // the date part is hidden on narrow screens (CSS); then it is in the tooltip
    const d = `${n.getUTCFullYear()}-${pad(n.getUTCMonth()+1)}-${pad(n.getUTCDate())}`;
    el.innerHTML = `<span class="clk-date">${d} </span>`
      + `${pad(n.getUTCHours())}:${pad(n.getUTCMinutes())}:${pad(n.getUTCSeconds())} UTC`;
    if (el.title !== d + ' UTC') el.title = d + ' UTC';
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
