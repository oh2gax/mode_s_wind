<!-- About window (from 2026-10-25): the author, the receiver site and MODE-S Wind in a nutshell.
     Included by base.html; opened with the navbar "About" button, closes with × / Esc / a click outside. -->
<div id="ab-overlay" class="wn-overlay" hidden>
  <div class="wn-box ab-box" role="dialog" aria-modal="true" aria-labelledby="ab-title">
    <div class="wn-head">
      <div class="ab-head-title" id="ab-title">About</div>
      <button id="ab-close" class="wn-close" type="button" title="Close (Esc)">×</button>
    </div>
    <div class="wn-body ab-body">
      {% include "_about_body.html" %}
    </div>
  </div>
</div>
