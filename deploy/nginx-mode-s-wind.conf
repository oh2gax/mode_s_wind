# nginx site for MODE-S Wind behind HTTPS (from 2026-10-27; README: Running in the cloud)
#
#   sudo cp deploy/nginx-mode-s-wind.conf /etc/nginx/sites-available/mode-s-wind
#   sudo sed -i 's/mode-s-wind.example.org/YOUR.DOMAIN/' /etc/nginx/sites-available/mode-s-wind
#   sudo ln -s /etc/nginx/sites-available/mode-s-wind /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d YOUR.DOMAIN        # adds HTTPS (443) and the http → https redirect
#
# MODE-S Wind itself listens on 127.0.0.1:8000 (config_local.py: WEB_HOST = "127.0.0.1",
# WEB_PORT = 8000, WEB_BEHIND_PROXY = True).

server {
    listen 80;
    server_name mode-s-wind.example.org;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # the visitor's address — set, not appended, so a visitor cannot add its own
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # the Live Map's live stream (text/event-stream) sends
        # "X-Accel-Buffering: no" itself, so nginx passes it on at once;
        # long-running requests (back-fills, Maintenance purges) get 5 min
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # After certbot has added HTTPS and the site works, tell browsers to use
    # HTTPS only (put this line inside the "listen 443 ssl" server block that
    # certbot writes, then sudo nginx -t && sudo systemctl reload nginx):
    # add_header Strict-Transport-Security "max-age=31536000" always;
}
